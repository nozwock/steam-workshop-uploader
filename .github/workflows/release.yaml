name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            bundle-arch: universal-apple-darwin

    defaults:
      run:
        shell: bash

    env:
      BIN_NAME: workshop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}
          # Prevent RUSTFLAGS from overriding `.cargo/config.toml`
          rustflags: ""

      - name: Add target for universal macOS
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Get Target Architecture
        run: |
          # ARCH="$(cargo rustc -- -vV | grep 'host:' | cut -d ' ' -f 2)"
          ARCH="${{ matrix.rust-target }}"
          BUNDLE_ARCH="${{ matrix.bundle-arch || matrix.rust-target }}"
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "BUNDLE_ARCH=$BUNDLE_ARCH" >> $GITHUB_ENV

      # Build and Find the Steamworks SDK library path
      - name: Build & Get Steamworks SDK library path
        id: steamworks
        run: |
          STEAMWORKS_LIB_PATH="$(cargo build --target "$ARCH" --release --bin "$BIN_NAME" --message-format json | jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("steamworks-sys"))) | .out_dir')"
          echo "STEAMWORKS_LIB_PATH=$STEAMWORKS_LIB_PATH" >> $GITHUB_ENV

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cargo build --target x86_64-apple-darwin --release --bin "$BIN_NAME"
          fi

      - name: Set Binary Filename
        run: |
          BIN_FILENAME="${BIN_NAME}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_FILENAME="${BIN_NAME}.exe"
          fi
          echo "BIN_FILENAME=$BIN_FILENAME" >> $GITHUB_ENV

      # Zip the binary and Steamworks SDK library
      - name: Create ZIP file
        run: |
          mkdir -p output
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            lipo -create -output output/"$BIN_FILENAME" \
              target/"$ARCH"/release/"$BIN_FILENAME" \
              target/x86_64-apple-darwin/release/"$BIN_FILENAME"
            lipo -info output/"$BIN_FILENAME"
            cp "$STEAMWORKS_LIB_PATH"/* output/
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/"$ARCH"/release/"$BIN_FILENAME" output/
            # Ignore *.lib on windows
            cp "$STEAMWORKS_LIB_PATH"/*.dll output/
          else
            cp target/"$ARCH"/release/"$BIN_FILENAME" output/
            cp "$STEAMWORKS_LIB_PATH"/* output/
          fi

          cd output
          BUNDLE_FILENAME="${BIN_NAME}-${BUNDLE_ARCH}.zip"
          7z a "$BUNDLE_FILENAME" *

          mkdir release
          mv "$BUNDLE_FILENAME" release/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: output/release/*
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
